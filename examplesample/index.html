<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#e9edf2" />
  <meta name="description" content="Sampling distributions. Editable populations, animated samples, and statistical comparisons." />
  <title>Sampling Distributions · examplesample</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <script>
    try { const mode=localStorage.getItem('examplesample-theme')||'system'; const theme=mode==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):mode; document.documentElement.dataset.theme=theme; document.documentElement.style.colorScheme=theme; } catch {}
  </script>
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
  {"imports": {
    "react": "https://esm.sh/react@19.2.0",
    "react-dom/client": "https://esm.sh/react-dom@19.2.0/client?external=react"
  }}
  </script>
</head>
<body>
  <div id="root"><div class="boot-screen"><span class="boot-mark">▥</span><p>Loading examplesample…</p></div></div>
  <noscript>examplesample needs JavaScript enabled to load the interface and Python engine.</noscript>
  <script type="module">
  import('./app.js').catch(error => {
    const root = document.getElementById('root');
    const main = document.createElement('main');
    main.className = 'fatal-error';
    const title = document.createElement('h1');
    title.textContent = 'Could not load examplesample.';
    const message = document.createElement('p');
    message.textContent = 'Check your connection and reload. The first visit needs access to the React CDN.';
    const button = document.createElement('button');
    button.textContent = 'Reload';
    button.addEventListener('click', () => location.reload());
    main.append(title, message, button);
    root.replaceChildren(main);
    console.error(error);
  });
</script>
</body>
</html>
